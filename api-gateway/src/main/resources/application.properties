spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:9090/eureka

jwt.secret=MI_CLAVE_SUPER_MEGA_ULTRA_SECRETA_123456789_ABCDEFG


spring.cloud.gateway.server.webmvc.routes[0].id=auth-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://MS-AUTH
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=catalog-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://MS-CATALOG
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/catalogo/**

spring.cloud.gateway.server.webmvc.routes[2].id=auditoria-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://MS-AUDITORIA
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/auditoria/**

spring.cloud.gateway.server.webmvc.routes[3].id=perfil-route
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://MS-PERFIL
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/perfil/**

spring.cloud.gateway.server.webmvc.routes[4].id=production-route
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://MS-PRODUCTION
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/produccion/**
